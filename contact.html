<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact - Crestpoint</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
<header>
  <h1 id="site-title"></h1>
  <div class="menu-toggle" id="menu-toggle">&#9776;</div>
  <nav id="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="projects.html">Projects</a>
    <a href="team.html">Team</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>


<div class="container">
  <section id="contact-info"></section>

  <section id="contact-form-section">
    <h4>Send Us a Message</h4>
    <form id="contact-form" style="display:flex;flex-direction:column;gap:12px;max-width:500px;">
      <input type="text" id="name" name="name" placeholder="Your Name" required>
      <input type="email" id="email" name="email" placeholder="Your Email" required>
      <input type="text" id="subject" name="subject" placeholder="Subject" required>
      <textarea id="message" name="message" placeholder="Message" rows="5" required></textarea>
      <button type="submit" class="btn-primary">Send Message</button>
    </form>
  </section>

  <section id="map-section">
    <h4>Our Location</h4>
    <iframe id="google-map" width="100%" height="400" style="border:0;"></iframe>
  </section>
</div>

<footer>
  &copy; 2025 Crestpoint | <a href="mailto:" id="contact-email"></a>
</footer>

  <script>
  const toggle = document.getElementById("menu-toggle");
  const nav = document.getElementById("nav-links");

  toggle.addEventListener("click", () => {
    nav.classList.toggle("show");
  });
</script>

  
<!-- ✅ Load siteData first -->
<script src="siteData.js"></script>
<script src="data.js"></script>

<!-- ✅ Inline script to populate contact info -->
<script>
  document.getElementById("site-title").textContent = siteData.siteTitle;
  document.getElementById("contact-email").textContent = siteData.contact.email;
  document.getElementById("contact-email").href = `mailto:${siteData.contact.email}`;

  // Optional: Embed Google Map using API key if available
  const mapFrame = document.getElementById("google-map");
  mapFrame.src = `https://www.google.com/maps/embed/v1/place?key=${siteData.contact.googleMapKey}&q=${encodeURIComponent(siteData.contact.address)}`;
</script>

</body>
</html>
