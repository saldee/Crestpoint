<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact - Crestpoint</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* ---------------- Modern Contact Page Styles ---------------- */
body {
  font-family: 'Roboto', sans-serif;
  color: #333;
  line-height: 1.6;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 30px;
  background: #005b96;
  color: #fff;
}

header nav a {
  color: #fff;
  margin-left: 15px;
  text-decoration: none;
  font-weight: 500;
  transition: color 0.3s;
}

header nav a:hover {
  color: #ffcc00;
}

.container {
  max-width: 1200px;
  margin: 40px auto;
  padding: 0 20px;
}

.contact-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 40px;
}

.contact-info, .contact-form {
  flex: 1;
  min-width: 300px;
  background: #f7f9fc;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 2px 15px rgba(0,0,0,0.05);
}

.contact-info h3, .contact-form h3 {
  margin-bottom: 20px;
  color: #005b96;
}

.contact-info p {
  margin-bottom: 10px;
  font-size: 16px;
}

.contact-form input, 
.contact-form textarea {
  width: 100%;
  padding: 12px 15px;
  margin-bottom: 15px;
  border-radius: 8px;
  border: 1px solid #ccc;
  transition: 0.3s;
}

.contact-form input:focus, 
.contact-form textarea:focus {
  border-color: #005b96;
  box-shadow: 0 0 5px rgba(0,91,150,0.2);
  outline: none;
}

.contact-form button {
  background-color: #005b96;
  color: #fff;
  padding: 12px 18px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
  transition: 0.3s;
}

.contact-form button:hover {
  background-color: #004070;
}

.contact-map iframe {
  width: 100%;
  height: 400px;
  border-radius: 12px;
  box-shadow: 0 2px 15px rgba(0,0,0,0.1);
  border: 0;
}

footer {
  text-align: center;
  padding: 20px;
  margin-top: 40px;
  color: #555;
  font-size: 14px;
}
</style>
</head>
<body>

<header>
  <h1 id="site-title"></h1>
  <nav id="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="projects.html">Projects</a>
    <a href="team.html">Team</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<div class="container">
  <div class="contact-grid">
    <!-- Contact Info -->
    <div class="contact-info">
      <h3>Contact Information</h3>
      <p><strong>Email:</strong> <span id="contact-email"></span></p>
      <p><strong>Phone:</strong> <span id="contact-phone"></span></p>
      <p><strong>Address:</strong> <span id="contact-address"></span></p>
    </div>

    <!-- Contact Form -->
    <div class="contact-form">
      <h3>Send a Message</h3>
      <form id="contact-form">
        <input type="text" id="name" name="name" placeholder="Your Name" required>
        <input type="email" id="email" name="email" placeholder="Your Email" required>
        <input type="text" id="subject" name="subject" placeholder="Subject" required>
        <textarea id="message" name="message" rows="5" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </div>
  </div>

  <!-- Google Map -->
  <div class="contact-map" style="margin-top:40px;">
    <iframe id="google-map" loading="lazy"></iframe>
  </div>
</div>

<footer>
  &copy; 2025 Crestpoint. All rights reserved.
</footer>

<script src="data.js"></script>
<script src="populate.js"></script>
<script>
  // Populate site title
  document.getElementById("site-title").textContent = siteData.siteTitle;

  // Populate contact info
  document.getElementById("contact-email").textContent = siteData.contact.email;
  document.getElementById("contact-phone").textContent = siteData.contact.phone;
  document.getElementById("contact-address").textContent = siteData.contact.address;

  // Populate Google Map dynamically
  const address = encodeURIComponent(siteData.contact.address);
  document.getElementById("google-map").src = `https://www.google.com/maps/embed/v1/place?key=${siteData.contact.googleMapKey}&q=${address}`;

  // Handle form submission (basic example)
  const form = document.getElementById("contact-form");
  form.addEventListener("submit", function(e) {
    e.preventDefault();
    alert("Thank you! Your message has been received.");
    form.reset();
  });
</script>
</body>
</html>
