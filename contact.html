<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact - Crestpoint</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body {
    font-family: 'Roboto', sans-serif;
    margin: 0;
    background-color: #f5f6fa;
    color: #fff;
  }

  header {
    background-color: #00274d; /* Dark navy */
    padding: 16px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  header h1 {
    margin: 0;
    font-size: 1.8rem;
  }

  header nav a {
    color: #fff;
    margin-left: 24px;
    text-decoration: none;
    font-weight: 500;
  }

  .container {
    max-width: 1100px;
    margin: 32px auto;
    padding: 0 16px;
  }

  .section-title {
    font-size: 1.8rem;
    color: #00274d;
    margin-bottom: 16px;
  }

  .contact-card {
    background-color: #003366;
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 24px;
  }

  .contact-card p {
    margin: 8px 0;
  }

  #contact-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 500px;
  }

  #contact-form input, 
  #contact-form textarea {
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 1rem;
  }

  #contact-form button {
    background-color: #00274d;
    color: #fff;
    padding: 12px;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
  }

  #contact-form button:hover {
    background-color: #001f3d;
  }

  #google-map {
    width: 100%;
    height: 400px;
    border-radius: 8px;
    margin-top: 24px;
  }

  footer {
    background-color: #00274d;
    color: #fff;
    text-align: center;
    padding: 16px;
    margin-top: 32px;
  }
</style>
</head>
<body>

<header>
  <h1 id="site-title"></h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="projects.html">Projects</a>
    <a href="team.html">Team</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<div class="container">

  <!-- Contact Info -->
  <section class="contact-card" id="contact-info">
    <h3 class="section-title">Contact Us</h3>
    <p><strong>Email:</strong> <span id="contact-email"></span></p>
    <p><strong>Phone:</strong> <span id="contact-phone"></span></p>
    <p><strong>Address:</strong> <span id="contact-address"></span></p>
  </section>

  <!-- Contact Form -->
  <section class="contact-card">
    <h4>Send Us a Message</h4>
    <form id="contact-form">
      <input type="text" id="name" name="name" placeholder="Your Name" required>
      <input type="email" id="email" name="email" placeholder="Your Email" required>
      <input type="text" id="subject" name="subject" placeholder="Subject" required>
      <textarea id="message" name="message" placeholder="Message" rows="5" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </section>

  <!-- Google Map -->
  <section>
    <h4 class="section-title">Our Location</h4>
    <iframe id="google-map" allowfullscreen="" loading="lazy"></iframe>
  </section>

</div>

<footer>
  &copy; 2025 Crestpoint. All rights reserved.
</footer>

<script src="data.js"></script>
<script src="populate.js"></script>
<script>
  // Populate common contact info dynamically
  document.getElementById("site-title").textContent = siteData.siteTitle;
  document.getElementById("contact-email").textContent = siteData.contact.email;
  document.getElementById("contact-phone").textContent = siteData.contact.phone;
  document.getElementById("contact-address").textContent = siteData.contact.address;

  // Populate Google Map dynamically
  const mapEl = document.getElementById("google-map");
  if (siteData.contact.googleMapKey) {
    const address = encodeURIComponent(siteData.contact.address);
    mapEl.src = `https://www.google.com/maps/embed/v1/place?key=${siteData.contact.googleMapKey}&q=${address}`;
  }

  // Contact form submission
  const form = document.getElementById("contact-form");
  form.addEventListener("submit", function(e) {
    e.preventDefault();
    alert("Thank you! Your message has been received.");
    form.reset();
  });
</script>

</body>
</html>
