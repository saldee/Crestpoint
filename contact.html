<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crestpoint | Contact</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header>
<nav>
    <div class="logo"><h2>Crestpoint</h2></div>
    <div class="menu">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="projects.html">Projects</a>
        <a href="team.html">Team</a>
        <a href="contact.html">Contact</a>
    </div>
</nav>
</header>

<!-- CONTACT SECTION -->
<section id="contact">
    <h2>Contact Us</h2>
    <div class="contact-form">
        <form action="#" method="POST">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" placeholder="Your Message" rows="6" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </div>

    <!-- Contact Info -->
    <div style="text-align:center; margin-top:40px;">
        <p>Email: info@crestpoint.com</p>
        <p>Phone: +256 700 000 000</p>
        <p>Address: 123 Project Street, Kampala, Uganda</p>
    </div>

    <!-- Optional Map Placeholder -->
    <div style="margin-top:40px; max-width:800px; margin-left:auto; margin-right:auto;">
        <img src="placeholder-map.jpg" alt="Map" style="width:100%; border-radius:10px;">
    </div>
</section>

<!-- FOOTER -->
<footer>
<p>&copy; 2025 Crestpoint. All Rights Reserved.</p>
<p>Follow us: 
    <a href="#">LinkedIn</a> | 
    <a href="#">Twitter</a> | 
    <a href="#">Facebook</a>
</p>
</footer>

</body>
</html>
