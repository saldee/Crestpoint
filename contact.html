<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Crestpoint</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Open+Sans&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <style>
    * {margin:0; padding:0; box-sizing:border-box;}
    body {font-family:'Open Sans',sans-serif; color:#333;}
    a {text-decoration:none; color:inherit;}

    /* Header */
    header {
      background-color:#0b2f5a; color:white; padding:20px 50px;
      display:flex; justify-content:space-between; align-items:center;
    }
    header nav a {margin-left:25px; font-weight:600; transition: color 0.3s;}
    header nav a:hover {color:#f5a623;}

    /* Hero Section */
    .hero {
      background:url('images/contact-hero.jpg') center/cover no-repeat;
      height:60vh; display:flex; align-items:center; justify-content:center; color:white; text-align:center;
      position:relative; overflow:hidden;
    }
    .hero::after {content:''; position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5);}
    .hero-content {position:relative; z-index:1; opacity:0; transform:translateY(20px); animation:fadeInUp 1s forwards 0.3s;}
    @keyframes fadeInUp {to {opacity:1; transform:translateY(0);}}
    .hero h1 {font-family:'Montserrat',sans-serif; font-size:2.8rem;}
    .hero p {font-size:1.2rem; margin-top:15px;}

    /* Contact Section */
    .contact-section {padding:80px 50px; max-width:800px; margin:0 auto;}
    .contact-section h2 {font-family:'Montserrat',sans-serif; font-size:2.5rem; margin-bottom:40px; text-align:center;}
    .contact-form {display:flex; flex-direction:column; gap:20px;}
    .contact-form input, .contact-form textarea {
      padding:15px; border-radius:5px; border:1px solid #ccc; font-size:1rem; width:100%;
      transition: border 0.3s, box-shadow 0.3s;
    }
    .contact-form input:focus, .contact-form textarea:focus {border-color:#0b2f5a; box-shadow:0 0 10px rgba(11,47,90,0.3);}
    .contact-form button {
      background-color:#f5a623; border:none; padding:15px; font-size:1rem; font-weight:bold; cursor:pointer; border-radius:5px; transition: transform 0.3s, box-shadow 0.3s;
    }
    .contact-form button:hover {transform:scale(1.05); box-shadow:0 5px 15px rgba(0,0,0,0.3);}

    /* Contact Info Section */
    .contact-info {margin-top:60px; text-align:center;}
    .contact-info p {margin-bottom:15px; font-size:1rem;}

    /* Footer */
    footer {background:#1c1c1c; color:#ccc; text-align:center; padding:30px 50px; font-size:0.9rem;}

    @media(max-width:768px){
      .hero h1 {font-size:2.2rem;}
      .hero p {font-size:1rem;}
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo"><img src="images/logo.png" alt="Crestpoint Logo" height="50"></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="services.html">Services</a>
      <a href="projects.html">Projects</a>
      <a href="industries.html">Industries</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>Contact Us</h1>
      <p>Get in touch with Crestpoint for project inquiries or collaborations</p>
    </div>
  </section>

  <!-- Contact Section -->
  <section class="contact-section">
    <h2>Send Us a Message</h2>
    <form class="contact-form" id="contactForm">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <input type="text" name="subject" placeholder="Subject" required>
      <textarea name="message" rows="6" placeholder="Your Message" required></textarea>
      <button type="submit">Submit</button>
    </form>

    <div class="contact-info" data-aos="fade-up">
      <p><strong>Email:</strong> info@crestpoint.com</p>
      <p><strong>Phone:</strong> +256 700 000 000</p>
      <p><strong>Address:</strong> Kampala, Uganda</p>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    &copy; 2025 Crestpoint. All Rights Reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({duration:1000, once:true});

    // Basic form validation
    const form = document.getElementById('contactForm');
    form.addEventListener('submit', function(e){
      e.preventDefault();
      const name = form.name.value.trim();
      const email = form.email.value.trim();
      const subject = form.subject.value.trim();
      const message = form.message.value.trim();

      if(!name || !email || !subject || !message){
        alert('Please fill in all fields.');
        return;
      }
      if(!/\S+@\S+\.\S+/.test(email)){
        alert('Please enter a valid email address.');
        return;
      }
      alert('Thank you! Your message has been submitted.');
      form.reset();
    });
  </script>
</body>
</html>
