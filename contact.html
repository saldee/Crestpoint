<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Crestpoint</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Open+Sans&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <style>
    * {margin:0; padding:0; box-sizing:border-box;}
    body {font-family:'Open Sans',sans-serif; color:#333;}
    a {text-decoration:none; color:inherit;}

    /* Header */
    header {background-color:#0b2f5a; color:white; padding:20px 50px; display:flex; justify-content:space-between; align-items:center; position:relative;}
    header nav a {margin-left:25px; font-weight:600; transition: color 0.3s;}
    header nav a:hover {color:#f5a623;}
    .mobile-menu-toggle {display:none; font-size:2rem; cursor:pointer; position:absolute; top:20px; right:30px; z-index:1000;}
    .nav-links-mobile {display:none; flex-direction:column; background:#0b2f5a; position:absolute; top:70px; right:0; width:200px; border-radius:0 0 5px 5px; padding:20px;}
    .nav-links-mobile a {margin:10px 0; font-weight:600; color:white;}

    /* Hero Section */
    .hero {background:url('images/contact-hero.jpg') center/cover no-repeat; height:50vh; display:flex; align-items:center; justify-content:center; color:white; text-align:center; position:relative; overflow:hidden;}
    .hero::after {content:''; position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5);}
    .hero-content {position:relative; z-index:1; opacity:0; transform:translateY(20px); animation:fadeInUp 1s forwards 0.3s;}
    @keyframes fadeInUp {to {opacity:1; transform:translateY(0);}}
    .hero h1 {font-family:'Montserrat',sans-serif; font-size:clamp(2rem, 4vw, 3rem);}
    .hero p {font-size:clamp(1rem, 2.5vw, 1.2rem); margin-top:15px;}

    /* Contact Section */
    .section {padding:80px 50px; max-width:1200px; margin:0 auto;}
    h2 {font-family:'Montserrat',sans-serif; font-size:2.5rem; margin-bottom:50px; text-align:center;}
    .contact-container {display:flex; gap:40px; flex-wrap:wrap;}
    .contact-form {flex:1 1 400px;}
    .contact-form input, .contact-form textarea {width:100%; padding:12px 15px; margin-bottom:20px; border-radius:5px; border:1px solid #ccc; font-size:1rem;}
    .contact-form button {background:#0b2f5a; color:white; padding:12px 20px; border:none; border-radius:5px; cursor:pointer; font-size:1rem; transition: background 0.3s;}
    .contact-form button:hover {background:#f5a623;}
    .map {flex:1 1 400px; border-radius:10px; overflow:hidden; min-height:400px;}
    iframe {width:100%; height:100%; border:0;}

    /* Footer */
    footer {background:#1c1c1c; color:#ccc; text-align:center; padding:30px 50px; font-size:0.9rem;}

    /* Responsive */
    @media(max-width:768px){
      .contact-container {flex-direction:column; align-items:center;}
      .hero h1 {font-size:2.2rem;}
      .hero p {font-size:1rem;}
      header nav {display:none;}
      .mobile-menu-toggle {display:block;}
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo"><img src="images/logo.png" alt="Crestpoint Logo" height="50"></div>
    <div class="mobile-menu-toggle">&#9776;</div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="services.html">Services</a>
      <a href="projects.html">Projects</a>
      <a href="industries.html">Industries</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="nav-links-mobile">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="services.html">Services</a>
      <a href="projects.html">Projects</a>
      <a href="industries.html">Industries</a>
      <a href="contact.html">Contact</a>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>Contact Us</h1>
      <p>Reach Out for Project Inquiries, Consultation, or Support</p>
    </div>
  </section>

  <!-- Contact Section -->
  <section class="section">
    <h2>Get In Touch</h2>
    <div class="contact-container">
      <!-- Form -->
      <div class="contact-form" data-aos="fade-up">
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <input type="text" placeholder="Subject" required>
        <textarea rows="6" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
      </div>

      <!-- Google Map -->
      <div class="map" data-aos="fade-up" data-aos-delay="100">
        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3989.1159654025285!2d32.58236647488327!3d0.3123456990467736!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x177db9d445d7f2a9%3A0x8f4d9f6e1e1a14d6!2sKampala%2C%20Uganda!5e0!3m2!1sen!2sus!4v1697042829476!5m2!1sen!2sus" 
          allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    &copy; 2025 Crestpoint. All Rights Reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({duration:1000, once:true});

    // Mobile menu toggle
    const toggle = document.querySelector('.mobile-menu-toggle');
    const mobileNav = document.querySelector('.nav-links-mobile');
    toggle.addEventListener('click', () => {
      mobileNav.style.display = mobileNav.style.display === 'flex' ? 'none' : 'flex';
    });

    // Smooth scrolling
    document.querySelectorAll('a[href^="#"]').forEach(anchor=>{
      anchor.addEventListener('click', function(e){
        e.preventDefault();
        document.querySelector(this.getAttribute('href')).scrollIntoView({behavior:'smooth'});
      });
    });
  </script>
</body>
</html>
