<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact - Crestpoint</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* --- Header --- */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 30px;
  background: #002b50; /* Dark Navy Blue */
  color: #fff;
}

header nav a {
  color: #fff;
  margin-left: 20px;
  text-decoration: none;
  font-weight: 500;
}

header nav a:hover {
  color: #ffcc00;
}

/* --- Container --- */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 40px 20px;
}

/* --- Section Titles --- */
.section-title {
  font-size: 28px;
  margin-bottom: 20px;
  color: #002b50;
  border-bottom: 2px solid #ffcc00;
  display: inline-block;
  padding-bottom: 5px;
}

/* --- Contact Info Cards --- */
.contact-card {
  background: #f5f5f5;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.contact-card p {
  margin: 8px 0;
  font-size: 16px;
}

/* --- Contact Form --- */
#contact-form {
  display: flex;
  flex-direction: column;
  gap: 15px;
  max-width: 500px;
}

#contact-form input,
#contact-form textarea {
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
}

#contact-form button {
  padding: 12px;
  border-radius: 8px;
  border: none;
  background: #002b50;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  transition: background 0.3s;
}

#contact-form button:hover {
  background: #ffcc00;
  color: #002b50;
}

/* --- Map --- */
#google-map {
  width: 100%;
  height: 400px;
  border-radius: 12px;
  margin-top: 30px;
  border: none;
}
</style>
</head>
<body>

<header>
  <h1 id="site-title"></h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="projects.html">Projects</a>
    <a href="team.html">Team</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<div class="container">
  <!-- Contact Info -->
  <section id="contact-info">
    <h3 class="section-title">Contact Us</h3>
    <div class="contact-card">
      <p><strong>Email:</strong> <span id="contact-email"></span></p>
      <p><strong>Phone:</strong> <span id="contact-phone"></span></p>
      <p><strong>Address:</strong> <span id="contact-address"></span></p>
    </div>
  </section>

  <!-- Contact Form -->
  <section id="contact-form-section">
    <h3 class="section-title">Send Us a Message</h3>
    <form id="contact-form">
      <input type="text" id="name" name="name" placeholder="Your Name" required>
      <input type="email" id="email" name="email" placeholder="Your Email" required>
      <input type="text" id="subject" name="subject" placeholder="Subject" required>
      <textarea id="message" name="message" placeholder="Message" rows="5" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </section>

  <!-- Google Map -->
  <section id="map-section">
    <h3 class="section-title">Our Location</h3>
    <iframe id="google-map" src="" allowfullscreen="" loading="lazy"></iframe>
  </section>
</div>

<footer style="padding:20px;text-align:center;background:#002b50;color:#fff;">
  &copy; 2025 Crestpoint. All rights reserved.
</footer>

<script src="data.js"></script>
<script src="populate.js"></script>
<script>
// Populate dynamic contact info
document.getElementById("site-title").textContent = siteData.siteTitle;
document.getElementById("contact-email").textContent = siteData.contact.email;
document.getElementById("contact-phone").textContent = siteData.contact.phone;
document.getElementById("contact-address").textContent = siteData.contact.address;

// Google Map
const address = encodeURIComponent(siteData.contact.address);
document.getElementById("google-map").src = `https://www.google.com/maps/embed/v1/place?key=YOUR_GOOGLE_MAPS_API_KEY&q=${address}`;

// Contact form alert
const form = document.getElementById("contact-form");
form.addEventListener("submit", function(e){
  e.preventDefault();
  alert("Thank you! Your message has been received.");
  form.reset();
});
</script>
</body>
</html>
