<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Contact Us - Crestpoint | Uganda Construction Firm</title>
  <meta name="description" content="Reach out to Crestpoint for construction inquiries, project consultations, or partnership opportunities across Uganda.">
  <meta name="keywords" content="contact Crestpoint, construction Uganda, project inquiries, building services, site supervision, EHS, renovation">
  <meta name="author" content="Crestpoint">
  <meta name="robots" content="index, follow">

  <!-- Favicon -->
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="images/favicon.png">

  <!-- Fonts & Styles -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Open Graph -->
  <meta property="og:title" content="Contact Crestpoint">
  <meta property="og:description" content="Get in touch with Crestpoint for construction services and project support across Uganda.">
  <meta property="og:image" content="https://saldee.github.io/Crestpoint/images/logo.png">
  <meta property="og:url" content="https://saldee.github.io/Crestpoint/contact.html">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Contact Crestpoint">
  <meta name="twitter:description" content="Get in touch with Crestpoint for construction services and project support across Uganda.">
  <meta name="twitter:image" content="https://saldee.github.io/Crestpoint/images/logo.png">
</head>
<body>

  <header>
    <a href="index.html">
      <img src="images/logo.png" alt="Crestpoint Logo" style="height:48px;">
    </a>
    <div class="menu-toggle" id="menu-toggle">&#9776;</div>
    <nav id="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="projects.html">Projects</a>
      <a href="team.html">Team</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <div class="container">
    <section id="contact-form-section">
      <!-- Contact Info Block -->
      <section id="contact-info">
        <h4>Contact Information</h4>
        <p><strong>Address:</strong> Plot 12, Kampala Road, Kampala, Uganda</p>
        <p><strong>Phone:</strong> +256 700 123456</p>
        <p><strong>Email:</strong> <a href="mailto:info@crestpoint.co.ug">info@crestpoint.co.ug</a></p>
        <p><strong>Hours:</strong> Mon–Fri, 8:00 AM – 5:00 PM</p>

        <!-- Embedded Google Map -->
        <div style="margin-top:20px;">
          <iframe
            src="https://www.google.com/maps?q=Plot+12+Kampala+Road,+Kampala,+Uganda&output=embed"
            width="100%"
            height="300"
            style="border:0; border-radius:8px;"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
          </iframe>
        </div>

        <!-- Get Directions Button -->
        <div style="margin-top:12px;">
          <a href="https://www.google.com/maps/dir/?api=1&destination=Plot+12+Kampala+Road,+Kampala,+Uganda"
             target="_blank" rel="noopener"
             style="display:inline-block; padding:10px 16px; background-color:#005b96; color:#fff; border-radius:8px; font-weight:500; text-decoration:none;">
            Get Directions
          </a>
        </div>
      </section>

      <!-- Contact Form Block -->
      <section>
        <h4>Send Us a Message</h4>
        <form id="contact-form" onsubmit="event.preventDefault(); alert('Message sent!');">
          <input type="text" id="name" name="name" placeholder="Your Name" required>
          <input type="email" id="email" name="email" placeholder="Your Email" required>
          <input type="text" id="subject" name="subject" placeholder="Subject" required>
          <textarea id="message" name="message" placeholder="Message" rows="5" required></textarea>
          <button type="submit">Send Message</button>
        </form>
      </section>
    </section>
  </div>

  <footer>
    &copy; 2025 Crestpoint | <a href="mailto:info@crestpoint.co.ug" id="contact-email">info@crestpoint.co.ug</a>
  </footer>

  <script>
    const toggle = document.getElementById("menu-toggle");
    const nav = document.getElementById("nav-links");
    toggle.addEventListener("click", () => {
      nav.classList.toggle("show");
    });
  </script>

  <script src="siteData.js"></script>
  <script src="data.js"></script>
</body>
</html>
