<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team - Crestpoint</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 id="site-title"></h1>
  <nav id="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="projects.html">Projects</a>
    <a href="team.html">Team</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<div class="container">
  <!-- Team Section -->
  <section id="team-section">
    <h3 class="section-title">Our Team</h3>
    <div class="team-grid" id="team-cards" style="display:flex;flex-wrap:wrap;gap:20px;margin-top:20px;"></div>
  </section>
</div>

<footer>
  &copy; 2025 Crestpoint. All rights reserved. | <a href="mailto:info@crestpoint.com" id="contact-email"></a>
</footer>

<script src="data.js"></script>
<script>
  // Set site title
  document.getElementById("site-title").textContent = siteData.siteTitle;

  // Footer contact email
  document.getElementById("contact-email").textContent = siteData.contact.email;

  // Populate Team Cards
  const teamContainer = document.getElementById("team-cards");
  siteData.team.forEach(member => {
    const card = document.createElement("div");
    card.className = "team-card";
    card.style.cssText = "flex:1 1 calc(25% - 20px);border:1px solid #ddd;border-radius:8px;padding:16px;text-align:center;";

    card.innerHTML = `
      <img src="${member.img}" alt="${member.name}" style="width:100px;height:100px;border-radius:50%;margin-bottom:12px;">
      <h4>${member.name}</h4>
      <p>${member.role}</p>
    `;

    teamContainer.appendChild(card);
  });
</script>
</body>
</html>
