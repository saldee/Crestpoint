<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Services - Crestpoint</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 id="site-title"></h1>
  <nav id="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="projects.html">Projects</a>
    <a href="team.html">Team</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<div class="container">
  <section id="services-section">
    <h3 class="section-title">Our Services</h3>
    <div class="cards" id="services-cards" style="display:flex;flex-wrap:wrap;gap:20px;margin-top:20px;"></div>
  </section>
</div>

<footer>
  &copy; 2025 Crestpoint. All rights reserved. | <a href="mailto:info@crestpoint.com" id="contact-email"></a>
</footer>

<script src="data.js"></script>
<script>
  // Set site title
  document.getElementById("site-title").textContent = siteData.siteTitle;

  // Populate contact email in footer
  document.getElementById("contact-email").textContent = siteData.contact.email;

  // Generate service cards
  const servicesContainer = document.getElementById("services-cards");

  siteData.services.forEach(service => {
    const card = document.createElement("div");
    card.className = "service-card";
    card.style.cssText = "flex:1 1 calc(50% - 20px);border:1px solid #ddd;border-radius:8px;padding:20px;text-align:center;";

    card.innerHTML = `
      <img src="images/default-service-icon.png" alt="${service.title}" style="width:60px;height:60px;margin-bottom:12px;">
      <h4>${service.title}</h4>
      <p>${service.desc}</p>
    `;

    servicesContainer.appendChild(card);
  });
</script>
</body>
</html>
