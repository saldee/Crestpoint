<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crestpoint | Home</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.ico">
  <link rel="apple-touch-icon" href="favicon.ico">
  <meta name="theme-color" content="#0b2f5a">  

  <!-- SEO Meta Tags -->
  <meta name="description" content="Crestpoint is a leading construction and project management company in Uganda, providing services across construction, real estate, and public/private sectors.">
  <meta name="keywords" content="Crestpoint, Construction, Project Management, Real Estate, Supervision, EHS, Uganda">
  <meta name="author" content="Crestpoint Company Ltd">
  <link rel="canonical" href="https://saldee.github.io/Crestpoint/index.html">
  <meta property="og:title" content="Crestpoint | Construction & Project Management">
  <meta property="og:description" content="Delivering excellence in construction, project management, and advisory services across Uganda.">
  <meta property="og:image" content="https://saldee.github.io/Crestpoint/assets/home-hero.jpg">
  <meta property="og:url" content="https://saldee.github.io/Crestpoint/index.html">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Fonts & AOS -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Open+Sans&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet" />

  <style>
    /* Reset & base */
    * {margin:0; padding:0; box-sizing:border-box;}
    body {font-family:'Open Sans',sans-serif; color:#333;}
    a {text-decoration:none; color:inherit;}

    /* Header */
    header {
      background-color:#0b2f5a; color:white;
      padding:20px 50px; display:flex; justify-content:space-between; align-items:center;
      position:relative; z-index:10000;
    }
    header .logo img {height:50px;}
    header nav a {margin-left:25px; font-weight:600; transition:color 0.3s;}
    header nav a:hover {color:#f5a623;}

    /* Mobile menu toggle */
    .mobile-menu-toggle {
      display:none; font-size:2rem; cursor:pointer;
      position:absolute; top:20px; right:30px; z-index:10001;
    }

    /* Mobile nav */
    .nav-links-mobile {
      display:none; flex-direction:column;
      background:#0b2f5a; position:absolute; top:70px; right:0;
      width:200px; border-radius:0 0 5px 5px; padding:20px;
      z-index:10002;
    }
    .nav-links-mobile a {margin:10px 0; font-weight:600; color:white;}
    .nav-links-mobile.show { display:flex !important; }

    /* Hero */
    .hero {
      background:url('assets/home-hero.jpg') center/cover no-repeat;
      height:60vh; display:flex; align-items:center; justify-content:center;
      color:white; text-align:center; position:relative;
    }
    .hero::after {
      content:''; position:absolute; top:0; left:0; right:0; bottom:0;
      background:rgba(0,0,0,0.6); z-index:1;
    }
    .hero-content {position:relative; z-index:2;}
    .hero h1 {font-family:'Montserrat',sans-serif; font-size:clamp(2rem,5vw,3rem); margin-bottom:10px;}
    .hero p {font-size:1.1rem;}

    /* Section */
    .section {padding:80px 50px; max-width:1200px; margin:0 auto;}
    h2 {font-family:'Montserrat',sans-serif; font-size:2.3rem; margin-bottom:30px; color:#0b2f5a; text-align:center;}

    /* Cards/Grid */
    .cards {display:flex; flex-wrap:wrap; gap:30px; justify-content:center;}
    .card {
      flex:1 1 250px; background:#fff; padding:30px; border-radius:10px; text-align:center;
      box-shadow:0 5px 15px rgba(0,0,0,0.1); transition:transform 0.3s;
    }
    .card:hover {transform:translateY(-10px);}
    .card img {width:60px; margin-bottom:15px;}
    .card h3 {font-family:'Montserrat'; color:#0b2f5a; margin-bottom:10px;}
    .card p {font-size:0.95rem; line-height:1.6;}

    /* Projects Grid */
    .projects-grid {display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:30px;}
    .project-card {position:relative; overflow:hidden; border-radius:10px; box-shadow:0 5px 15px rgba(0,0,0,0.1); cursor:pointer; transition:transform 0.3s, box-shadow 0.3s;}
    .project-card:hover {transform:translateY(-5px); box-shadow:0 10px 25px rgba(0,0,0,0.15);}
    .project-card img {width:100%; height:220px; object-fit:cover; display:block;}
    .project-overlay {position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(11,47,90,0.85); color:white; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; opacity:0; transition:opacity 0.3s; padding:20px;}
    .project-card:hover .project-overlay {opacity:1;}
    .project-overlay h3 {font-family:'Montserrat'; font-size:1.4rem; margin-bottom:10px; color:#f5a623;}
    .project-overlay p {font-size:0.95rem; line-height:1.5;}

    /* Footer */
    footer {background:#1c1c1c; color:#ccc; text-align:center; padding:30px 50px; font-size:0.9rem;}

    /* Floating WhatsApp */
    .whatsapp-float {
      position: fixed; bottom: 20px; right: 20px; z-index: 10000;
      width: 45px; height: 45px; background: #25D366; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.25);
      transition: transform 0.3s, box-shadow 0.3s; animation: float 2.5s infinite ease-in-out;
    }
    .whatsapp-float img { width: 22px; transition: transform 0.3s; }
    .whatsapp-float:hover { transform: scale(1.2); box-shadow: 0 8px 20px rgba(0,0,0,0.35); }
    @keyframes float { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-5px);} }

    /* Responsive */
    @media(max-width:768px){
      header nav {display:none;}
      .mobile-menu-toggle {display:block;}
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo"><img src="assets/logo.png" alt="Crestpoint Logo" height="50"></div>
    <div class="mobile-menu-toggle">&#9776;</div>
    <nav class="nav-links">
      <a href="index.html" style="color:#f5a623;">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="projects.html">Projects</a>
      <a href="industries.html">Industries</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="nav-links-mobile">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="projects.html">Projects</a>
      <a href="industries.html">Industries</a>
      <a href="contact.html">Contact</a>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-content" data-aos="fade-up">
      <h1>Welcome to Crestpoint</h1>
      <p>Delivering excellence in Construction, Project Management, and Advisory services.</p>
    </div>
  </section>

  <!-- About, Services, Projects, Industries & Footer remain same as your current HTML -->

  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({duration:1000, once:true});

    // Mobile menu toggle
    const toggle = document.querySelector('.mobile-menu-toggle');
    const mobileNav = document.querySelector('.nav-links-mobile');

    toggle.addEventListener('click', () => {
      mobileNav.classList.toggle('show');
    });

    // Hide mobile menu when clicking outside
    document.addEventListener('click', (e) => {
      if (!toggle.contains(e.target) && !mobileNav.contains(e.target)) {
        mobileNav.classList.remove('show');
      }
    });
  </script>

</body>
</html>
