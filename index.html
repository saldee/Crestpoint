<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home - Crestpoint</title>
<meta name="description" content="">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 id="site-title"></h1>
  <nav id="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="projects.html">Projects</a>
    <a href="team.html">Team</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<!-- Hero Section -->
<section class="hero">
  <video id="heroVideo" autoplay muted loop playsinline poster="images/hero-poster.png">
    <source src="videos/hero.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  <div class="overlay"></div>
  <div class="hero-content container">
    <h2 id="hero-tagline"></h2>
    <div style="margin-top:14px">
      <a href="about.html" class="btn-primary">Learn More</a>
      <a href="services.html" class="btn-secondary">Our Services</a>
    </div>
  </div>
</section>

<div class="container">

  <!-- About Preview -->
  <section id="about-preview"></section>

  <!-- Services Preview -->
  <section>
    <h3 class="section-title">Our Core Services</h3>
    <div id="services-cards" class="grid-container"></div>
    <a href="services.html" class="btn-primary" style="margin-top:16px;display:inline-block;">Explore All Services</a>
  </section>

  <!-- Featured Projects -->
  <section>
    <h3 class="section-title">Featured Projects</h3>
    <div id="projects-cards" class="grid-container"></div>
    <a href="projects.html" class="btn-primary" style="margin-top:16px;display:inline-block;">View All Projects</a>
  </section>

  <!-- Team Preview -->
  <section>
    <h3 class="section-title">Meet Our Team</h3>
    <div id="team-cards" class="grid-container"></div>
    <a href="team.html" class="btn-primary" style="margin-top:16px;display:inline-block;">View Full Team</a>
  </section>

  <!-- Testimonials -->
  <section>
    <h3 class="section-title">Client Testimonials</h3>
    <div id="testimonials-cards" class="grid-container"></div>
  </section>

  <!-- Blog Preview -->
  <section>
    <h3 class="section-title">Latest Insights</h3>
    <div id="blog-cards" class="grid-container"></div>
  </section>

</div>

<footer>
  &copy; 2025 Crestpoint. All rights reserved. | <a href="mailto:info@crestpoint.com" id="contact-email"></a>
</footer>

<script src="data.js"></script>
<script>
  // Site title and tagline
  document.getElementById("site-title").textContent = siteData.siteTitle;
  document.getElementById("hero-tagline").textContent = siteData.tagline;
  document.getElementById("contact-email").textContent = siteData.contact.email;

  // Meta description for SEO
  document.querySelector('meta[name="description"]').setAttribute('content', siteData.about.content);

  // About Preview
  document.getElementById("about-preview").innerHTML = `
    <h3 class="section-title">${siteData.about.heading}</h3>
    <p>${siteData.about.content}</p>
  `;

  // Services Cards
  const servicesContainer = document.getElementById("services-cards");
  siteData.services.forEach(s => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<img src="images/default-service-icon.png" alt="${s.title}" class="card-icon">
                      <h4>${s.title}</h4>
                      <p>${s.desc}</p>`;
    servicesContainer.appendChild(card);
  });

  // Projects Cards
  const projectsContainer = document.getElementById("projects-cards");
  siteData.projects.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<img src="${p.img}" alt="${p.title}" class="card-img">
                      <h4>${p.title}</h4>
                      <p>${p.desc}</p>`;
    projectsContainer.appendChild(card);
  });

  // Team Cards
  const teamContainer = document.getElementById("team-cards");
  siteData.team.forEach(m => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<img src="${m.img}" alt="${m.name}" class="card-img-circle">
                      <h4>${m.name}</h4>
                      <p>${m.role}</p>`;
    teamContainer.appendChild(card);
  });

  // Testimonials Cards
  const testimonialsContainer = document.getElementById("testimonials-cards");
  siteData.testimonials.forEach(t => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<p>"${t.text}"</p><h5>- ${t.name}</h5>`;
    testimonialsContainer.appendChild(card);
  });

  // Blog Cards
  const blogContainer = document.getElementById("blog-cards");
  siteData.blogPosts.forEach(b => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<h4>${b.title}</h4><small>${b.date}</small>
                      <p>${b.excerpt}</p>
                      <a href="${b.link}" class="btn-secondary">Read More</a>`;
    blogContainer.appendChild(card);
  });
</script>
</body>
</html>
