<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home - Crestpoint</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 id="site-title"></h1>
  <nav id="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="projects.html">Projects</a>
    <a href="team.html">Team</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<section class="hero">
  <video id="heroVideo" autoplay muted loop playsinline poster="images/hero-poster.png">
    <source src="videos/hero.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  <div class="overlay"></div>
  <div class="hero-content container">
    <h2 id="hero-tagline"></h2>
    <div style="margin-top:14px">
      <a href="about.html" style="background:#005b96;color:#fff;padding:10px 14px;border-radius:6px;margin-right:8px">Learn More</a>
      <a href="services.html" style="background:#fff;color:#005b96;padding:10px 14px;border-radius:6px">Our Services</a>
    </div>
  </div>
</section>

<div class="container">
  <!-- About Preview -->
  <section id="about-preview"></section>

  <!-- Services Preview -->
  <section id="services-preview">
    <h3 class="section-title">Our Core Services</h3>
    <div class="services-grid" id="services-cards" style="display:flex;gap:20px;flex-wrap:wrap;margin-top:20px;"></div>
    <a href="services.html" style="background:#005b96;color:#fff;padding:10px 14px;border-radius:6px;margin-top:16px;display:inline-block">Explore All Services</a>
  </section>

  <!-- Featured Projects -->
  <section id="featured-projects">
    <h3 class="section-title">Featured Projects</h3>
    <div class="projects-grid" id="projects-cards" style="display:flex;gap:20px;flex-wrap:wrap;margin-top:20px;"></div>
    <a href="projects.html" style="background:#005b96;color:#fff;padding:10px 14px;border-radius:6px;margin-top:16px;display:inline-block">View All Projects</a>
  </section>

  <!-- Team Preview -->
  <section id="team-preview">
    <h3 class="section-title">Meet Our Team</h3>
    <div class="team-grid" id="team-cards" style="display:flex;gap:20px;flex-wrap:wrap;margin-top:20px;"></div>
    <a href="team.html" style="background:#005b96;color:#fff;padding:10px 14px;border-radius:6px;margin-top:16px;display:inline-block">View Full Team</a>
  </section>
</div>

<footer>
  &copy; 2025 Crestpoint. All rights reserved. | <a href="mailto:info@crestpoint.com" id="contact-email"></a>
</footer>

<script src="data.js"></script>
<script>
  document.getElementById("site-title").textContent = siteData.siteTitle;
  document.getElementById("hero-tagline").textContent = siteData.tagline;
  document.getElementById("contact-email").textContent = siteData.contact.email;

  // About preview
  document.getElementById("about-preview").innerHTML = `
    <h3 class="section-title">${siteData.about.heading}</h3>
    <p>${siteData.about.content}</p>
  `;

  // Services cards
  const servicesContainer = document.getElementById("services-cards");
  siteData.services.forEach(s => {
    const card = document.createElement("div");
    card.style.cssText = "flex:1 1 calc(33% - 20px);border:1px solid #ddd;border-radius:8px;padding:16px;text-align:center;";
    card.innerHTML = `<img src="images/default-service-icon.png" alt="${s.title}" style="width:60px;height:60px;margin-bottom:12px;">
      <h4>${s.title}</h4><p>${s.desc}</p>`;
    servicesContainer.appendChild(card);
  });

  // Projects cards
  const projectsContainer = document.getElementById("projects-cards");
  siteData.projects.forEach(p => {
    const card = document.createElement("div");
    card.style.cssText = "flex:1 1 calc(33% - 20px);border:1px solid #ddd;border-radius:6px;overflow:hidden;";
    card.innerHTML = `<img src="${p.img}" alt="${p.title}" style="width:100%;height:180px;object-fit:cover;">
      <div style="padding:12px;"><h4>${p.title}</h4><p>${p.desc}</p></div>`;
    projectsContainer.appendChild(card);
  });

  // Team cards
  const teamContainer = document.getElementById("team-cards");
  siteData.team.forEach(m => {
    const card = document.createElement("div");
    card.style.cssText = "flex:1 1 calc(25% - 20px);border:1px solid #ddd;border-radius:8px;padding:16px;text-align:center;";
    card.innerHTML = `<img src="${m.img}" alt="${m.name}" style="width:100px;height:100px;border-radius:50%;margin-bottom:12px;">
      <h4>${m.name}</h4><p>${m.role}</p>`;
    teamContainer.appendChild(card);
  });
</script>
</body>
</html>
