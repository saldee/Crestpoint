<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>About - Crestpoint</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 id="site-title"></h1>
  <nav id="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="projects.html">Projects</a>
    <a href="team.html">Team</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<div class="container">
  <section id="about-section"></section>

  <section id="vmv-section" style="display:flex;gap:20px;flex-wrap:wrap;margin-top:30px;"></section>
</div>

<footer>
  &copy; 2025 Crestpoint. All rights reserved. | <a href="mailto:info@crestpoint.com" id="contact-email"></a>
</footer>

<script src="data.js"></script>
<script>
  document.getElementById("site-title").textContent = siteData.siteTitle;
  document.getElementById("contact-email").textContent = siteData.contact.email;

  // About section
  document.getElementById("about-section").innerHTML = `<h3 class="section-title">${siteData.about.heading}</h3>
    <p>${siteData.about.content}</p>`;

  // Vision, Mission, Values
  const vmvContainer = document.getElementById("vmv-section");
  siteData.visionMissionValues.forEach(item => {
    const card = document.createElement("div");
    card.style.cssText = "flex:1 1 calc(33% - 20px);border:1px solid #ddd;border-radius:8px;padding:20px;text-align:center;";
    card.innerHTML = `<img src="${item.img}" alt="${item.title}" style="width:60px;height:60px;margin-bottom:12px;">
      <h4>${item.title}</h4><p style="text-align:left">${item.desc}</p>`;
    vmvContainer.appendChild(card);
  });
</script>
</body>
</html>
